# Publishes the built site to GitHub Pages.
#
# dist/ is deliberately not committed — checking in build output makes every
# change show up twice in every diff — so Pages is fed from a build that runs
# here instead.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; a half-applied
# deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # Pages serves the site from /<repo>/, not the domain root. Derived
        # from the repository name so renaming the repo cannot leave the built
        # asset URLs pointing at a path that no longer exists.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/configure-pages@v5
        # Turns Pages on for the repository if it is not already, so the first
        # run does not fail on a setting nobody has touched yet.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
